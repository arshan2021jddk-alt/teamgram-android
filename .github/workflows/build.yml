name: Build Teamgram APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Release APK
      run: |
        chmod +x gradlew
        ./gradlew :TMessagesProj_App:assembleAfatRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Teamgram-APK
        path: TMessagesProj_App/build/outputs/apk/afat/release/
